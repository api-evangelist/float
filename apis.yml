description: >-
  Float is a design-led product lab founded by David Okuniev and Neil Kinnish, the ex-Typeform
  Labs team, building new consumer and creator software products under the mantra "we make new
  products float." Its first product is Supercut, an AI-assisted video tool entering beta. Float
  raised a EUR 1.6M seed round led by Point Nine Capital with angels including Koen Bok (Framer),
  Christian Reber and Niklas Jansen (Interface Capital), Soleio, and Robert Munoz (Typeform). As of
  this enrichment pass Float publishes only a marketing site (float.build) and product landing pages
  and exposes no public API, developer documentation, SDKs, or developer platform.
